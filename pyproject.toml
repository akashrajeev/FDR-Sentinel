[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "fdr-sentinel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0.40,<2.1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "pydantic-settings>=2.8,<3",
  "PyJWT[crypto]>=2.10,<3", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1",
  "minio>=7.2,<8", "celery[redis]>=5.5,<6", "pymupdf>=1.25,<2",
  "prometheus-client>=0.21,<1", "opentelemetry-sdk>=1.45,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "playwright>=1.51,<2"]

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.setuptools.package-data]
sentinel = ["policies/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real local service integration", "browser: actual browser workflow"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
