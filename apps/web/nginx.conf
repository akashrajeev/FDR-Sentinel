server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 11m;
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api_upstream http://api:8000;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:8081; img-src 'self' blob: data:; frame-src http://localhost:8081; object-src 'none'; base-uri 'self'; form-action 'self' http://localhost:8081" always;
  location /api/ { proxy_pass $api_upstream$request_uri; proxy_set_header Host $host; proxy_read_timeout 30s; }
  location / { try_files $uri /index.html; }
}
