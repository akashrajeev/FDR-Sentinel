name: verify
on: [push, pull_request]
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: python scripts/bootstrap.py
      - run: docker compose up --build -d
      - run: docker compose --profile test run --rm test
      - run: npm ci --prefix apps/web && npm run build --prefix apps/web
      - run: docker compose run --rm --no-deps api ruff check --no-cache apps/api scripts tests
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/local.py -m pytest -q -m browser
      - run: npm audit --prefix apps/web --audit-level=high
      - if: always()
        run: docker compose logs --no-color > compose.log
      # Diagnostic upload is optional; test and lint steps above remain mandatory.
      - if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with: {name: diagnostics, path: compose.log, retention-days: 1}
